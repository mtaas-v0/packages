name: Code Metrics (SCC)

on:
  workflow_dispatch: # Allows you to trigger it manually

jobs:
  scc:
    runs-on: ubuntu-22.04
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@1f8e202ffddf94def7f42f6fa3a482e821489f9c # 2026.07.10.1
        
      - name: Install scc via Homebrew
        run: brew install scc jq
        
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate and Append Job Summary
        run: |
          echo "## 📊 Code Statistics Report" >> $GITHUB_STEP_SUMMARY
          echo "Generated using [scc](https://github.com)." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Run scc in markdown format and append directly to the GitHub summary file
          scc --format markdown >> $GITHUB_STEP_SUMMARY

      - name: Run scc and Parse with Python
        run: |
          # 1. Output the raw json by file
          scc --format json --by-file 

      - name: python type stat
        run: |
          python3 -c """
          import os
          from pathlib import Path

          def human_readable_size(size_bytes):
              if size_bytes == 0: return '0 B'
              units = ['B', 'KB', 'MB', 'GB']
              i = 0
              while size_bytes >= 1024 and i < len(units) - 1:
                  size_bytes /= 1024.0
                  i += 1
              return f'{size_bytes:.2f} {units[i]}'

          stats = {}
          
          for p in Path('.').rglob('*'):
              if p.is_dir() or '.git' in p.parts:
                  continue
                  
              try:
                  bytes_size = p.stat().st_size
                  ext = p.suffix.lower() if p.suffix else '(no extension)'
                  
                  if ext not in stats:
                      stats[ext] = {'count': 0, 'bytes': 0}
                  
                  stats[ext]['count'] += 1
                  stats[ext]['bytes'] += bytes_size
              except FileNotFoundError:
                  continue

          sorted_stats = sorted(stats.items(), key=lambda x: x['bytes'], reverse=True)

          summary_lines = [
              '## 📦 File Extension & Size Metrics',
              '| Extension | File Count | Total Size |',
              '| :--- | :---: | :---: |'
          ]

          for ext, metrics in sorted_stats:
              readable_size = human_readable_size(metrics['bytes'])
              # FIX: Use clean double quotes for f-string and simple single quotes for the dict key lookup
              summary_lines.append(f\"| {ext} | {metrics['count']} | {readable_size} |\")

          summary_file = os.environ.get('GITHUB_STEP_SUMMARY')
          if summary_file:
              with open(summary_file, 'a') as sf:
                  sf.write('\n'.join(summary_lines) + '\n')
          """
