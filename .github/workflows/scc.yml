name: Code Metrics (SCC)

on:
  workflow_dispatch: # Allows you to trigger it manually

jobs:
  scc:
    runs-on: ubuntu-22.04
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@1f8e202ffddf94def7f42f6fa3a482e821489f9c # 2026.07.10.1
        
      - name: Install scc via Homebrew
        run: brew install scc jq
        
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate and Append Job Summary
        run: |
          echo "## 📊 Code Statistics Report" >> $GITHUB_STEP_SUMMARY
          echo "Generated using [scc](https://github.com)." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Run scc in markdown format and append directly to the GitHub summary file
          scc --format markdown >> $GITHUB_STEP_SUMMARY
