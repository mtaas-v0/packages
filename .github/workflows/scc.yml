name: Code Metrics (SCC)

on:
  workflow_dispatch: # Allows you to trigger it manually

jobs:
  scc:
    runs-on: ubuntu-22.04
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@1f8e202ffddf94def7f42f6fa3a482e821489f9c # 2026.07.10.1
        
      - name: Install scc via Homebrew
        run: brew install scc jq
        
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate and Append Job Summary
        run: |
          echo "## 📊 Code Statistics Report" >> $GITHUB_STEP_SUMMARY
          echo "Generated using [scc](https://github.com)." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Run scc in markdown format and append directly to the GitHub summary file
          scc --format markdown >> $GITHUB_STEP_SUMMARY

      - name: Process File Extensions and Sizes
        run: |
          # 1. Title for the GitHub Summary UI
          echo "## 📦 File Extension & Size Metrics" >> $GITHUB_STEP_SUMMARY
          echo "| Extension | File Count | Total Size |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :---: | :---: |" >> $GITHUB_STEP_SUMMARY

          # 2. Extract, aggregate, format size to human-readable units, and append to Summary
          scc --format json2 --by-file | jq -r '
            [ .[] | .Files[] ] 

            | group_by(.Location | split(".")[-1]) 
            | .[] 
            | {
                ext: (.[0].Location | split(".")[-1]), 
                count: length, 
                bytes: (map(.Bytes) | add)
              }
            | select(.ext != "")
            | sort_by(-.bytes)
            | .[]
            | [
                ("." + .ext),
                .count,
                if .bytes >= 1073741824 then (((.bytes / 1073741824 * 100) | round / 100 | tostring) + " GB")
                elif .bytes >= 1048576 then (((.bytes / 1048576 * 100) | round / 100 | tostring) + " MB")
                elif .bytes >= 1024 then (((.bytes / 1024 * 100) | round / 100 | tostring) + " KB")
                else (.bytes | tostring) + " B"
                end
              ]

            | "| " + join(" | ") + " |"
          ' >> $GITHUB_STEP_SUMMARY
